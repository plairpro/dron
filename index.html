<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#070b0e"><title data-i18n="title">Дрон</title><meta name="description" content="Пилотируйте защищённый промышленный дрон в глубине тёмной пещеры."><link rel="icon" type="image/svg+xml" href="./drone-icon-cropped.svg"><link rel="stylesheet" href="./style.css?v=light-1"></head><body><main id="game" aria-label="Игра Дрон" data-i18n-aria="gameLabel"><canvas id="scene"></canvas><div id="vignette"></div><div id="impact"></div><section id="intro" class="screen"><div class="intro-slogan" aria-label="Исследуйте опасные глубины подземных шахт одной кнопкой" data-i18n-aria="sloganLabel"><div class="slogan-lines"><span data-i18n="slogan1">Исследуйте опасные</span><span data-i18n="slogan2">глубины подземных шахт</span><span data-i18n="slogan3">одной кнопкой</span></div></div><div class="intro-copy"><h1><span class="title-accent" data-i18n="title">Дрон</span></h1><p data-i18n="hint">Жми пробел или тапай по экрану для взлёта</p><button id="start"><span data-i18n="start">Полетели</span> <span class="drone-icon" aria-hidden="true"></span></button></div><a class="studio-badge" href="https://www.plair.pro/studio/" target="_blank" rel="noopener noreferrer" aria-label="Plair Studio"><img src="./plair-studio.png" alt="Plair Studio"></a></section><div id="hud" hidden><div class="instrument"><div><strong id="distance">0000</strong><span class="unit" data-i18n="meters">м</span></div></div><div class="integrity"><span class="eyebrow" data-i18n="shield">ЗАЩИТА</span><div id="lives" aria-label="3 жизни"><i></i><i></i><i></i></div></div><div class="energy"><span class="eyebrow" data-i18n="charge">ЗАРЯД</span><div id="charge" aria-label="3 из 3 заряда"><i></i><i></i><i></i></div></div><button id="pause" aria-label="Пауза" data-i18n-aria="pauseAction">Ⅱ</button><button id="sound" aria-label="Выключить звук" data-i18n-aria="soundOff">♪</button></div><div id="paused" class="screen" hidden><div class="panel"><span class="eyebrow" data-i18n="pausedLabel">ПОЛЁТ ПРИОСТАНОВЛЕН</span><h2 data-i18n="pause">Пауза</h2><button id="resume" data-i18n="resume">Продолжить</button></div></div><section id="end" tabindex="-1" class="screen" hidden role="dialog" aria-modal="true" aria-label="Результат полёта" data-i18n-aria="resultLabel"><div class="panel"><div class="result" aria-label="Пройденная дистанция" data-i18n-aria="distanceLabel"><strong id="score">0</strong><span data-i18n="meters">м</span></div><button id="restart"><span data-i18n="restart">В начало</span> <span class="drone-icon" aria-hidden="true"></span></button></div></section><div id="error" class="screen" hidden><div class="panel"><h2 data-i18n="webglTitle">Нужна поддержка WebGL</h2><p data-i18n="webglHelp">Откройте игру в браузере с включённым аппаратным ускорением.</p></div></div></main><audio id="music" src="./drone-music.mp3" loop preload="none"></audio><script src="./i18n.js?v=stand-1"></script><script type="module" src="./game.js?v=battery-interval-1"></script></body></html>
